<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StillHere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
        <div class="logo">StillHere</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('dashboard') }}" class="active">Dashboard</a>
            <a href="{{ url_for('about') }}">About</a>
        </div>
    </nav>

    <div class="dashboard-container" style="max-width: 1200px; margin: 2rem auto; padding: 0 5%;">
        <h1 style="margin-bottom: 2rem;">Your Memorials</h1>
        
        <div class="memorials-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;">
            <div class="memorial-card" style="background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 2px solid var(--border); text-align: center;">
                <p style="color: var(--text-muted); margin-bottom: 1rem;">You haven't created any memorials yet.</p>
                <a href="{{ url_for('index') }}#pricing" class="cta-button primary">Create Your First Memorial</a>
            </div>
        </div>
    </div>
</body>
</html>
